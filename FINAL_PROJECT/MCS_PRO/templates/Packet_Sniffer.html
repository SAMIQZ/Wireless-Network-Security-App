{% load static %}
{% include 'componas/Base.html' %}
<title>Packet Sniffer — WI-WN</title>
</head>
<body>
<div class="app-layout">
    {% include 'componas/Navbar.html' %}

    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">Packet Sniffer</div>
        </header>

        <main class="content-area">
            <section id="ssec" class="card">
                <h1>Sniffed Packets</h1>
                <textarea id="TX" rows="22" readonly>
{% for packet in packets %}
{{ packet }}
{% empty %}
No packets sniffed yet.
{% endfor %}
                </textarea>
            </section>
        </main>

        {% include 'componas/Footer.html' %}
    </div>
</div>
</body>
</html>
