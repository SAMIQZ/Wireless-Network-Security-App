{% load static %}
{% include 'componas/Base.html' %}
<title>Password Info — WI-WN</title>
</head>
<body>
<div class="app-layout">
    {% include 'componas/Navbar.html' %}
    <div class="main-content">
        <header class="topbar"><div class="topbar-title">Password Keep Info</div></header>
        <main class="content-area">
            <section id="ssec" class="card">
                <h1 style="text-align:center;">Saved Credentials</h1>
                <div style="display: flex; flex-direction: column; gap: 1rem; max-width: 520px; margin-top: 1rem;">
                    <div class="info-row">
                        <strong>TITLE</strong>
                        <span>{{ KEEP.TITLE }}</span>
                    </div>
                    <div class="info-row">
                        <strong>URL</strong>
                        <span>{{ KEEP.URLS }}</span>
                    </div>
                    <div class="info-row">
                        <strong>USERNAME</strong>
                        <span>{{ KEEP.USERNAME }}</span>
                    </div>
                    <div class="info-row">
                        <strong>PASSWORD</strong>
                        <span>{{ KEEP.PASSWORD }}</span>
                    </div>
                </div>
            </section>
        </main>
        {% include 'componas/Footer.html' %}
    </div>
</div>
</body>
</html>
