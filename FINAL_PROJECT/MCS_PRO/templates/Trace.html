{% load static %}
{% include 'componas/Base.html' %}
<title>Traceroute — WI-WN</title>
</head>
<body>
<div class="app-layout">
    {% include 'componas/Navbar.html' %}
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">Traceroute Lookup</div>
        </header>
        <main class="content-area">
            <section id="ssec" class="card">
                <h1>Traceroute Lookup</h1>
                <form action="" method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" id="submit" style="margin-top: 0.75rem;">Trace</button>
                    <textarea id="TX" rows="14" readonly style="margin-top: 1.25rem;">{{ RESULT }}</textarea>
                </form>
            </section>
        </main>
        {% include 'componas/Footer.html' %}
    </div>
</div>
</body>
</html>
