cls{% load static %}
{% include 'componas/Base.html' %}
<title>Custom Credentials — WI-WN</title>
</head>
<body>
<div class="app-layout">
    {% include 'componas/Navbar.html' %}
    <div class="main-content">
        <header class="topbar">
            <div class="topbar-title">Custom Username & Password</div>
        </header>
        <main class="content-area">
            <section id="fsec" class="card">
                <h1>Custom Username & Password</h1>
                <form action="" method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" style="margin-top: 1rem;">Check</button>
                </form>
                <h1>{{ URESULT }}</h1>
                <h1>{{ PRESULT }}</h1>
            </section>
        </main>
        {% include 'componas/Footer.html' %}
    </div>
</div>
</body>
</html>
